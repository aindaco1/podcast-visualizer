name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0, Node 24
        with:
          version: "0.11.7"
          python-version: "3.13"
          prune-cache: true
      - name: Install fixture codecs
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run test:coverage
      - run: uv run --directory alignment-runner --python 3.13 ruff check .
      - run: uv run --directory alignment-runner --python 3.13 pytest

  macos:
    name: Swift tests and arm64 builds
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select stable Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcode_version="$(xcodebuild -version)"
          test "${xcode_version%%$'\n'*}" = "Xcode 26.3"
          swift --version
      - run: ./scripts/ci/validate-macos.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 22
          cache: npm

      - name: Prepare exact-commit release app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PODCAST_VISUALIZER_RELEASE_TOOL_NODE: node
          PODCAST_VISUALIZER_CI_APP_ARTIFACT: ${{ runner.temp }}/podcast-visualizer-ci-app-${{ github.sha }}.tar.gz
        run: |
          ./scripts/release/prepare-ci-app.sh \
            "$PODCAST_VISUALIZER_CI_APP_ARTIFACT" "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Attest exact-commit release app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/podcast-visualizer-ci-app-${{ github.sha }}.tar.gz

      - name: Retain exact-commit release app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: podcast-visualizer-verified-app-${{ github.sha }}
          path: ${{ runner.temp }}/podcast-visualizer-ci-app-${{ github.sha }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # This public-preview runner is a compiler and SDK signal, not a macOS 27
  # runtime test. Keep releases on the pinned stable toolchain until the
  # signed-app beta/RC matrix in docs/testing/macos-27-readiness.md passes.
  xcode-27-compatibility:
    name: Xcode 27 compatibility (preview)
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          submodules: recursive
      - name: Report preview toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      # SwiftPM currently fails to stage Sparkle.framework for executable-
      # target tests under Swift Build. Compile with the new engine, then run
      # the complete gate with the native engine until upstream issue #10384
      # is fixed.
      - name: Compile with Swift Build
        env:
          PODCAST_VISUALIZER_SWIFT_BUILD_SYSTEM: swiftbuild
          PODCAST_VISUALIZER_MACOS_VALIDATION: compile
        run: ./scripts/ci/validate-macos.sh
      - name: Test and build with native SwiftPM
        env:
          PODCAST_VISUALIZER_SWIFT_BUILD_SYSTEM: native
          PODCAST_VISUALIZER_MACOS_VALIDATION: full
        run: ./scripts/ci/validate-macos.sh
