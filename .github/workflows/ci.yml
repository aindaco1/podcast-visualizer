name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0, Node 24
        with:
          version: "0.11.7"
          python-version: "3.13"
          prune-cache: true
      - name: Install fixture codecs
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run test:coverage
      - run: uv run --directory alignment-runner --python 3.13 ruff check .
      - run: uv run --directory alignment-runner --python 3.13 pytest
